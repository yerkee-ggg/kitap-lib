<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KITAP — Цифрлық кітапхана платформасы</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#F8F7F4',
                        emeraldCustom: '#174D43',
                        sage: '#DCEAE2',
                        gold: '#D8AD70',
                        graphite: '#202925'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #F8F7F4; color: #202925; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-cream text-graphite antialiased">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [view, setView] = React.useState('home');
            const [institution, setInstitution] = React.useState('Astana International University (AITU)');
            const [toast, setToast] = React.useState(null);

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 3000);
            };

            const books = [
                { id: 1, title: 'Python тілінде бағдарламалау негіздері', author: 'А. Жұмағұлов', category: 'Бағдарламалау', year: 2024, status: 'available' },
                { id: 2, title: 'Алгоритмдер және деректер құрылымы', author: 'Томас Кормен', category: 'Computer Science', year: 2023, status: 'queue' },
                { id: 3, title: 'Жасанды интеллект және Machine Learning', author: 'С. Ахметов', category: 'AI & Data', year: 2025, status: 'available' }
            ];

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header */}
                    <header className="bg-white/90 backdrop-blur border-b border-sage/40 sticky top-0 z-50 px-6 py-4 flex items-center justify-between shadow-sm">
                        <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setView('home')}>
                            <div className="bg-emeraldCustom text-white font-bold px-3.5 py-1.5 rounded-xl text-lg tracking-wider">KITAP</div>
                            <span className="text-xs bg-sage/60 text-emeraldCustom px-2.5 py-1 rounded-full font-medium hidden sm:inline-block">{institution}</span>
                        </div>
                        <nav className="hidden md:flex items-center space-x-6 text-sm font-medium">
                            <button onClick={() => setView('home')} className="hover:text-emeraldCustom transition">Басты бет</button>
                            <button onClick={() => setView('catalog')} className="hover:text-emeraldCustom transition">Каталог</button>
                            <button onClick={() => setView('institutions')} className="hover:text-emeraldCustom transition">Оқу орындары</button>
                            <button onClick={() => setView('ai')} className="hover:text-emeraldCustom transition text-gold font-semibold">✨ KITAP AI</button>
                        </nav>
                        <div>
                            <button onClick={() => setView('dashboard')} className="bg-emeraldCustom text-white px-4 py-2 rounded-xl text-sm font-medium hover:opacity-90 transition shadow">
                                Кабинет
                            </button>
                        </div>
                    </header>

                    {/* Toast */}
                    {toast && (
                        <div className="fixed bottom-6 right-6 bg-emeraldCustom text-white px-6 py-3 rounded-2xl shadow-xl z-50 animate-bounce text-sm font-medium">
                            {toast}
                        </div>
                    )}

                    {/* Content */}
                    <main className="flex-1">
                        {view === 'home' && (
                            <div className="max-w-5xl mx-auto px-6 py-20 text-center">
                                <span className="bg-sage/50 text-emeraldCustom px-4 py-1.5 rounded-full text-xs font-semibold uppercase tracking-wider">Цифрлық кітапхана платформасы 2026</span>
                                <h1 className="text-4xl md:text-6xl font-extrabold mt-6 text-emeraldCustom leading-tight">
                                    Сенің кітапханаң — бір платформада
                                </h1>
                                <p className="mt-6 text-base md:text-lg text-graphite/70 max-w-2xl mx-auto">
                                    Кітаптарды ізде, қолжетімділігін тексер, онлайн бронь жаса және кезегіңді бақыла.
                                </p>
                                <div className="mt-10 flex justify-center gap-4">
                                    <button onClick={() => setView('catalog')} className="bg-emeraldCustom text-white px-8 py-3.5 rounded-xl font-medium shadow-lg hover:opacity-90 transition">
                                        Кітаптарды қарау
                                    </button>
                                    <button onClick={() => setView('institutions')} className="bg-white border border-sage text-emeraldCustom px-8 py-3.5 rounded-xl font-medium hover:bg-sage/20 transition shadow-sm">
                                        Оқу орнын таңдау
                                    </button>
                                </div>
                            </div>
                        )}

                        {view === 'catalog' && (
                            <div className="max-w-5xl mx-auto px-6 py-10">
                                <h2 className="text-3xl font-bold text-emeraldCustom mb-6">Кітаптар каталогы</h2>
                                <div className="grid md:grid-cols-3 gap-6">
                                    {books.map(book => (
                                        <div key={book.id} className="bg-white p-6 rounded-2xl border border-sage/40 shadow-sm hover:shadow-md transition">
                                            <span className="text-xs bg-sage/40 text-emeraldCustom px-2.5 py-1 rounded-md font-medium">{book.category}</span>
                                            <h3 className="font-bold text-lg mt-3 text-emeraldCustom">{book.title}</h3>
                                            <p className="text-sm text-graphite/70 mt-1">{book.author} ({book.year})</p>
                                            <div className="mt-6 flex items-center justify-between">
                                                <span className={`text-xs px-2.5 py-1 rounded-full font-medium ${book.status === 'available' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                                                    {book.status === 'available' ? 'Қолжетімді' : 'Кезекте'}
                                                </span>
                                                <button onClick={() => showToast(`"${book.title}" сәтті броньдалды!`)} className="bg-emeraldCustom text-white text-xs px-4 py-2 rounded-xl font-medium hover:opacity-90 transition">
                                                    Бронь жасау
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'institutions' && (
                            <div className="max-w-5xl mx-auto px-6 py-10 text-center">
                                <h2 className="text-3xl font-bold text-emeraldCustom mb-6">Оқу орнын таңдаңыз</h2>
                                <div className="grid md:grid-cols-3 gap-6">
                                    <div onClick={() => { setInstitution('Astana International University (AITU)'); setView('catalog'); showToast('AITU кітапханасы таңдалды'); }} className="bg-white p-6 rounded-2xl border border-sage/40 cursor-pointer hover:border-emeraldCustom transition shadow-sm">
                                        <h3 className="font-bold text-lg text-emeraldCustom">Astana International University</h3>
                                        <p className="text-sm text-graphite/60 mt-1">Университет кітапханасы</p>
                                    </div>
                                    <div onClick={() => { setInstitution('ҚазҰУ (Al-Farabi University)'); setView('catalog'); showToast('ҚазҰУ кітапханасы таңдалды'); }} className="bg-white p-6 rounded-2xl border border-sage/40 cursor-pointer hover:border-emeraldCustom transition shadow-sm">
                                        <h3 className="font-bold text-lg text-emeraldCustom">Әл-Фараби атындағы ҚазҰУ</h3>
                                        <p className="text-sm text-graphite/60 mt-1">Ұлттық университет кітапханасы</p>
                                    </div>
                                    <div onClick={() => { setInstitution('NIS Astana'); setView('catalog'); showToast('NIS кітапханасы таңдалды'); }} className="bg-white p-6 rounded-2xl border border-sage/40 cursor-pointer hover:border-emeraldCustom transition shadow-sm">
                                        <h3 className="font-bold text-lg text-emeraldCustom">NIS Astana</h3>
                                        <p className="text-sm text-graphite/60 mt-1">Мектеп кітапханасы</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'ai' && (
                            <div className="max-w-3xl mx-auto px-6 py-10">
                                <div className="bg-white p-8 rounded-3xl border border-sage/40 shadow-sm">
                                    <h2 className="text-2xl font-bold text-emeraldCustom mb-2">✨ KITAP AI Көмекшісі</h2>
                                    <p className="text-sm text-graphite/70 mb-6">Қандай кітап іздеп жатқаныңызды жазыңыз.</p>
                                    <div className="bg-cream p-4 rounded-2xl h-48 mb-4 border border-sage/30 flex flex-col gap-3">
                                        <div className="bg-white p-3 rounded-xl max-w-md text-sm shadow-sm">
                                            Сәлем! Мен KITAP AI көмекшісімін. Сізге қандай оқулық тауып берейін?
                                        </div>
                                    </div>
                                    <div className="flex gap-3">
                                        <input type="text" placeholder="Мысалы: Python кітаптары..." className="flex-1 bg-cream border border-sage rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emeraldCustom" />
                                        <button onClick={() => showToast('AI жауап дайындауда...')} className="bg-emeraldCustom text-white px-6 py-3 rounded-xl text-sm font-medium">Жіберу</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'dashboard' && (
                            <div className="max-w-5xl mx-auto px-6 py-10">
                                <h2 className="text-3xl font-bold text-emeraldCustom mb-6">Студент кабинеті</h2>
                                <div className="grid md:grid-cols-3 gap-6">
                                    <div className="bg-white p-6 rounded-2xl border border-sage/40 shadow-sm">
                                        <p className="text-sm text-graphite/60">Қолымдағы кітаптар</p>
                                        <h3 className="text-3xl font-bold text-emeraldCustom mt-2">1</h3>
                                    </div>
                                    <div className="bg-white p-6 rounded-2xl border border-sage/40 shadow-sm">
                                        <p className="text-sm text-graphite/60">Белсенді броньдар</p>
                                        <h3 className="text-3xl font-bold text-emeraldCustom mt-2">0</h3>
                                    </div>
                                    <div className="bg-white p-6 rounded-2xl border border-sage/40 shadow-sm">
                                        <p className="text-sm text-graphite/60">Кезектегі кітаптар</p>
                                        <h3 className="text-3xl font-bold text-emeraldCustom mt-2">1</h3>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="bg-white border-t border-sage/40 py-6 text-center text-xs text-graphite/60 mt-12">
                        © 2026 KITAP — Цифрлық кітапхана платформасы. Барлық құқықтар қорғалған.
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
